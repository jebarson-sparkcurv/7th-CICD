name: Application Deployment

on:
  push:
    branches:
      - main
permissions:
  contents: read
  issues: write
jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: yarn build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Test backend
        working-directory: backend
        run: python -m py_compile main.py
        
      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist

      - name: Upload backend
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          path: backend
  deploy:
    name: Deploy Application
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-build

      - name: Check downloaded files
        run: |
          echo "Frontend files:"
          ls -la frontend-build

          echo "Backend files:"
          ls -la backend-build 
          
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/github-actions
          chmod 600 ~/.ssh/github-actions

          
      - name: Test EC2 connection
        run: |
          ssh -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "echo 'Connected to EC2 successfully'"

            
      - name: Prepare release directory
        run: |
          ssh -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo mkdir -p /var/www/cicd-app/releases/${{ github.sha }} && \
             sudo mkdir -p /opt/cicd-app-backend/releases/${{ github.sha }} && \
             sudo chown -R ubuntu:ubuntu /var/www/cicd-app /opt/cicd-app-backend"

      - name: Configure NGINX
        run: |
          ssh -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo tee /etc/nginx/sites-available/cicd-app > /dev/null <<'EOF'
          server {
              listen 4000;
              server_name _;

              root /var/www/cicd-app/current;
              index index.html;

              location /api/ {
                  proxy_pass http://127.0.0.1:8000/;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }
          EOF

          sudo ln -sfn /etc/nginx/sites-available/cicd-app /etc/nginx/sites-enabled/cicd-app
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl reload nginx"            

             
      - name: Copy frontend to EC2
        run: |
          scp -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            -r frontend-build/* \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/cicd-app/releases/${{ github.sha }}/"

      - name: Copy backend to EC2
        run: |
          scp -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            -r backend-build/* \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/cicd-app-backend/releases/${{ github.sha }}/"

      - name: Prepare backend runtime
        run: |
          ssh -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "python3 -m venv /opt/cicd-app-backend/releases/${{ github.sha }}/venv && \
             /opt/cicd-app-backend/releases/${{ github.sha }}/venv/bin/pip install -r /opt/cicd-app-backend/releases/${{ github.sha }}/requirements.txt"            

   
          
      - name: Activate new release
        run: |
          ssh -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo ln -sfn /var/www/cicd-app/releases/${{ github.sha }} /var/www/cicd-app/current && \
             sudo ln -sfn /opt/cicd-app-backend/releases/${{ github.sha }} /opt/cicd-app-backend/current"
  
      - name: Restart backend
        run: |
          ssh -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo systemctl restart cicd-backend && \
             sudo systemctl is-active --quiet cicd-backend"             
 
      - name: Health check
        run: |
          ssh -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "set -e; \
             echo 'Checking backend...'; \
             curl -f http://127.0.0.1:8000/health; \
             echo 'Checking application...'; \
             curl -f http://127.0.0.1:4000/api/health; \
             echo 'Checking frontend...'; \
             curl -f http://127.0.0.1:4000"             
 
      
      - name: Rollback deployment
        if: failure()
        run: |
          echo "Health check failed. Rolling back..."

          ssh -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo ln -sfn '$PREVIOUS_FRONTEND' /var/www/cicd-app/current && \
             sudo ln -sfn '$PREVIOUS_BACKEND' /opt/cicd-app-backend/current && \
             sudo systemctl restart cicd-backend && \
             sudo systemctl is-active --quiet cicd-app-backend && \
             echo 'Rollback completed successfully'"

      - name: Verify rollback
        if: failure() && env.HAS_PREVIOUS_RELEASE == 'true'
        run: |
          echo "Verifying rollback..."

          ssh -i ~/.ssh/github-actions \
            -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "set -e; \
             curl -f http://127.0.0.1:8000/health; \
             curl -f http://127.0.0.1:4000/api/health; \
             curl -f http://127.0.0.1:4000; \
             echo 'Rollback verification successful'"

      - name: Notify reviewer
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Deployment failed - ${{ github.sha }}" \
            --body "Deployment failed for commit ${{ github.sha }}.

          Previous release available: ${{ env.HAS_PREVIOUS_RELEASE }}

          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
